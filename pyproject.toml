[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsh"
version = "0.1.0"
description = "Lightweight Jira time-tracking helper for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Casey Luo" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "keyring>=25.0",
    "tomli-w>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pystray>=0.19",
    "pywebview>=5.0",
    "pywin32>=306; sys_platform == 'win32'",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pyinstaller>=6.5",
]

[project.scripts]
tsh = "tsh.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["tsh"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
